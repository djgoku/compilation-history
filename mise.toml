[task_config]
includes = [
  ".mise/tasks",
  "git::https://github.com/djgoku/mise-melpa-checks.git//tasks?ref=v0.0.1",
]

[tools]
"conda:git" = { version = "latest", os = ["macos"] }
"conda:bash" = { version = "latest", os = ["macos"] }

[tasks.gen-workflows]
description = 'Regenerates GitHub Actions YAML (SHA-pinned via DependabotManagedActions) from the Pkl sources'
tools = { pkl = "latest" }
run = "pkl eval --project-dir .github/ -m .github/ .github/index.pkl"
sources = ['.github/index.pkl', '.github/workflows/*.pkl', '.github/PklProject*']
outputs = [
  '.github/workflows/ci.yml',
  '.github/workflows/__lockfile__.yml',
  '.github/dependabot.yml',
]

[tasks.check-workflows]
description = 'Fails if the committed workflow YAML differs from what the Pkl sources generate'
run = '''
# --force: the sources/outputs mtime check skips regeneration after a hand
# edit to the YAML, which would let this check pass on a stale file.
mise run --force gen-workflows
if [ -n "$(git status --porcelain -- .github)" ]; then
  git status --short -- .github
  git diff -- .github
  echo "check-workflows: generated YAML is stale; run 'mise run gen-workflows' and commit" >&2
  exit 1
fi
'''
